apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: user-namespace-net-admin
priority: null
allowPrivilegeEscalation: true
allowedCapabilities:
- SETUID
- SETGID
- NET_ADMIN
fsGroup:
  type: MustRunAs
  ranges:
  - min: 1000
    max: 65534
runAsUser:
  type: MustRunAs
  uid: 1000
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    type: container_engine_t
supplementalGroups:
  type: MustRunAs
  ranges:
  - min: 1000
    max: 65534
userNamespaceLevel: RequirePodLevel