schemaVersion: 2.2.0
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: ocp-4-20-user-namespaces
projects:
  - name: ocp-4-20-user-namespaces
    git:
      remotes:
        origin: https://github.com/cgruver/ocp-4-20-user-namespaces.git
      checkoutFrom:
        remote: origin
        revision: main
components:
- name: dev-tools
  container: 
    image: quay.io/cgruver0/che/ocp-4-20-userns:latest
    memoryLimit: 8Gi
    cpuLimit: "2"
    env:
    - name: VSCODE_DEFAULT_WORKSPACE
      value: "/projects/ocp-4-20-user-namespaces/vscode.code-workspace"
    endpoints:
    - exposure: public
      name: podman
      protocol: https
      targetPort: 8080
- name: prep-workspace
  container:
    args:
      - '-c'
      - >-
        mkdir -p /projects/.bin && cp /usr/bin/oc /projects/.bin/oc && cp /usr/bin/kubectl /projects/.bin/kubectl 
    command:
      - /bin/bash
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    mountSources: true
    sourceMapping: /projects
    memoryRequest: 128Mi
    memoryLimit: 256Mi
    cpuRequest: 10m
    cpuLimit: 200m
    env:
    - name: HOME
      value: "/projects"
commands:
- apply:
    component: prep-workspace
    label: Pre Start Prep
  id: prep-workspace
events:
  preStart:
    - prep-workspace
